- id: climbing-stairs
  title: Climbing stairs
  difficulty: easy
  prompt: |
    You climb a staircase of `n` steps, taking **1 or 2** steps at a time. Return how many distinct ways reach the top. `n` can be up to 80, so plain recursion is too slow.
  starter: |
    def climb_stairs(n):
        if n <= 1:
            return 1
        return climb_stairs(n - 1) + climb_stairs(n - 2)
  hints:
    - "`ways(n) = ways(n - 1) + ways(n - 2)`. Keep just the last two values in a loop."
  tests:
    - name: small values
      code: |
        assert [climb_stairs(n) for n in range(1, 7)] == [1, 2, 3, 5, 8, 13]
    - name: large n quickly
      code: |
        import time
        t = time.perf_counter()
        assert climb_stairs(80) == 37889062373143906
        assert time.perf_counter() - t < 0.5
  solution: |
    def climb_stairs(n):
        a, b = 1, 1
        for _ in range(n - 1):
            a, b = b, a + b
        return b
- id: house-robber
  title: House robber
  difficulty: medium
  prompt: |
    Houses in a row hold `money[i]`. You can't take from two **adjacent** houses. Return the maximum total. Lists can be 100,000 long.

    ```py
    rob([2, 7, 9, 3, 1])   # -> 12  (2 + 9 + 1)
    ```
  starter: |
    def rob(money):
        return max(sum(money[::2]), sum(money[1::2]), default=0)
  hints:
    - "At house i you either skip it (`best[i-1]`) or take it (`best[i-2] + money[i]`)."
    - Only the previous two bests are needed.
  tests:
    - name: examples
      code: |
        assert rob([1, 2, 3, 1]) == 4 and rob([2, 7, 9, 3, 1]) == 12 and rob([]) == 0 and rob([5]) == 5
    - name: skipping two in a row can be best
      code: |
        assert rob([2, 1, 1, 9]) == 11 and rob([10, 1, 1, 10, 1]) == 20
    - name: long street
      code: |
        assert rob([1] * 100_000) == 50_000
  solution: |
    def rob(money):
        prev2, prev1 = 0, 0
        for m in money:
            prev2, prev1 = prev1, max(prev1, prev2 + m)
        return prev1
- id: coin-change
  title: Coin change
  difficulty: medium
  prompt: |
    Return the **fewest coins** needed to make `amount` from the given denominations (unlimited supply of each), or `-1` if it's impossible.

    ```py
    min_coins([1, 3, 4], 6)    # -> 2  (3 + 3, not greedy 4 + 1 + 1)
    ```
  starter: |
    def min_coins(coins, amount):
        count = 0
        for c in sorted(coins, reverse=True):
            count += amount // c
            amount %= c
        return count if amount == 0 else -1
  hints:
    - "`dp = [0] + [inf] * amount`; fill `dp[a]` from `dp[a - c] + 1` for each coin c."
  tests:
    - name: greedy fails, DP wins
      code: |
        assert min_coins([1, 3, 4], 6) == 2
    - name: examples
      code: |
        assert min_coins([1, 2, 5], 11) == 3 and min_coins([2], 3) == -1 and min_coins([1], 0) == 0
    - name: larger amount
      code: |
        assert min_coins([186, 419, 83, 408], 6249) == 20
  solution: |
    def min_coins(coins, amount):
        inf = float("inf")
        dp = [0] + [inf] * amount
        for a in range(1, amount + 1):
            for c in coins:
                if c <= a and dp[a - c] + 1 < dp[a]:
                    dp[a] = dp[a - c] + 1
        return dp[amount] if dp[amount] != inf else -1
- id: longest-common-subsequence
  title: Longest common subsequence
  difficulty: hard
  prompt: |
    Return the length of the longest **subsequence** common to strings `a` and `b`. A subsequence keeps order but may skip characters (`"ace"` is a subsequence of `"abcde"`). Strings can be 1,000 characters long.
  starter: |
    def lcs(a, b):
        return len(set(a) & set(b))
  hints:
    - "`dp[i][j]` = LCS of `a[:i]` and `b[:j]`, a table of size (len(a)+1) × (len(b)+1) filled with zeros."
    - "Matching characters: `dp[i-1][j-1] + 1`; otherwise `max(dp[i-1][j], dp[i][j-1])`."
  tests:
    - name: examples
      code: |
        assert lcs("abcde", "ace") == 3 and lcs("abc", "abc") == 3 and lcs("abc", "def") == 0 and lcs("", "x") == 0
    - name: order matters
      code: |
        assert lcs("abc", "cba") == 1 and lcs("AGGTAB", "GXTXAYB") == 4
    - name: long strings in time
      code: |
        import time
        a = "ab" * 500
        b = "ba" * 500
        t = time.perf_counter()
        assert lcs(a, b) == 999
        assert time.perf_counter() - t < 5
  solution: |
    def lcs(a, b):
        m, n = len(a), len(b)
        dp = [[0] * (n + 1) for _ in range(m + 1)]
        for i in range(1, m + 1):
            for j in range(1, n + 1):
                if a[i - 1] == b[j - 1]:
                    dp[i][j] = dp[i - 1][j - 1] + 1
                else:
                    dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
        return dp[m][n]
