- id: cosine-similarity
  title: Cosine similarity
  difficulty: easy
  prompt: |
    Write `cosine(a, b)` for two equal-length lists of numbers: the dot product divided by the product of their lengths (Euclidean norms). If either vector is all zeros, return `0.0`. Round the result to 4 decimals.
  starter: |
    import math

    def cosine(a, b):
        return 0.0
  hints:
    - "`dot = sum(x * y for x, y in zip(a, b))`"
    - "`norm_a = math.sqrt(sum(x * x for x in a))`"
  tests:
    - name: same direction
      code: |
        assert cosine([1, 2, 3], [2, 4, 6]) == 1.0
    - name: orthogonal and opposite
      code: |
        assert cosine([1, 0], [0, 5]) == 0.0 and cosine([1, 1], [-1, -1]) == -1.0
    - name: general case
      code: |
        assert cosine([1, 2], [2, 1]) == 0.8
    - name: zero vector
      code: |
        assert cosine([0, 0], [1, 2]) == 0.0
  solution: |
    import math

    def cosine(a, b):
        dot = sum(x * y for x, y in zip(a, b))
        na = math.sqrt(sum(x * x for x in a))
        nb = math.sqrt(sum(y * y for y in b))
        if na == 0 or nb == 0:
            return 0.0
        return round(dot / (na * nb), 4)
- id: chunk-text
  title: Chunk with overlap
  difficulty: medium
  prompt: |
    Write `chunk_words(text, size, overlap)` that splits `text` into chunks of `size` words, where each chunk starts `size - overlap` words after the previous one. Rules:

    - Chunks are words joined with single spaces.
    - The last chunk may be shorter, but don't produce a final chunk that contains **only** words already covered by the previous chunk.
    - Empty text returns `[]`. Raise `ValueError` if `overlap >= size`.

    ```py
    chunk_words("a b c d e f g", 3, 1)   # -> ["a b c", "c d e", "e f g"]
    ```
  starter: |
    def chunk_words(text, size, overlap):
        return [text]
  hints:
    - "`step = size - overlap`; start positions are `range(0, len(words), step)`."
    - "Stop once a chunk reaches the end of the word list (`start + size >= len(words)`)."
  tests:
    - name: example
      code: |
        assert chunk_words("a b c d e f g", 3, 1) == ["a b c", "c d e", "e f g"], chunk_words("a b c d e f g", 3, 1)
    - name: shorter last chunk
      code: |
        assert chunk_words("a b c d e f", 4, 1) == ["a b c d", "d e f"]
    - name: no redundant tail
      code: |
        assert chunk_words("a b c d e", 3, 1) == ["a b c", "c d e"]
    - name: short text and empty text
      code: |
        assert chunk_words("only two", 5, 2) == ["only two"] and chunk_words("   ", 3, 1) == []
    - name: invalid overlap
      code: |
        try:
            chunk_words("a b", 2, 2)
            raise AssertionError("expected ValueError")
        except ValueError:
            pass
  solution: |
    def chunk_words(text, size, overlap):
        if overlap >= size:
            raise ValueError("overlap must be smaller than size")
        words = text.split()
        chunks = []
        step = size - overlap
        for start in range(0, len(words), step):
            chunks.append(" ".join(words[start : start + size]))
            if start + size >= len(words):
                break
        return chunks
- id: retrieve-top-k
  title: Retrieve the top k
  difficulty: medium
  prompt: |
    Build a tiny retriever. `embed(text)` (a simple bag-of-words over a fixed vocabulary) and `cosine(a, b)` are provided.

    Write `top_k(query, docs, k)` where `docs` is a dict `{doc_id: text}`. Return a list of the `k` doc ids most similar to the query, highest score first. Break ties by doc id (alphabetical). Leave out documents with a score of 0.
  starter: |
    import math
    import re

    VOCAB = ["refund", "days", "delivery", "express", "return", "items", "payment", "order"]

    def embed(text):
        words = re.findall(r"[a-z]+", text.lower())
        return [sum(1 for w in words if w.startswith(v)) for v in VOCAB]

    def cosine(a, b):
        dot = sum(x * y for x, y in zip(a, b))
        n = math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b))
        return dot / n if n else 0.0

    def top_k(query, docs, k):
        return list(docs)[:k]
  hints:
    - "Score every doc: `cosine(embed(query), embed(text))`."
    - "Sort with `key=lambda pair: (-score, doc_id)`."
  tests:
    - name: ranks by similarity
      code: |
        docs = {
            "refunds": "Refunds reach your payment method in 7 days.",
            "delivery": "Delivery takes 3 days; express delivery 1 day.",
            "returns": "Return unused items within 30 days for a refund.",
            "careers": "We are hiring engineers.",
        }
        assert top_k("how many days until my refund", docs, 2) == ["refunds", "returns"], top_k("how many days until my refund", docs, 2)
    - name: excludes zero scores and respects k
      code: |
        docs = {"a": "express delivery", "b": "hello world", "c": "delivery days"}
        assert top_k("express delivery please", docs, 5) == ["a", "c"], top_k("express delivery please", docs, 5)
  solution: |
    import math
    import re

    VOCAB = ["refund", "days", "delivery", "express", "return", "items", "payment", "order"]

    def embed(text):
        words = re.findall(r"[a-z]+", text.lower())
        return [sum(1 for w in words if w.startswith(v)) for v in VOCAB]

    def cosine(a, b):
        dot = sum(x * y for x, y in zip(a, b))
        n = math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b))
        return dot / n if n else 0.0

    def top_k(query, docs, k):
        q = embed(query)
        scored = [(cosine(q, embed(text)), doc_id) for doc_id, text in docs.items()]
        scored = [s for s in scored if s[0] > 0]
        scored.sort(key=lambda pair: (-pair[0], pair[1]))
        return [doc_id for _, doc_id in scored[:k]]
- id: reciprocal-rank-fusion
  title: Merge rankings with RRF
  difficulty: medium
  prompt: |
    Hybrid search produces two or more ranked lists (vector, keyword...). Merge them with **Reciprocal Rank Fusion**.

    Write `rrf(*rankings, k=60)`:

    - Each ranking is a list of document ids, best first. A document at **rank r** (starting from 1) earns `1 / (k + r)` points from that list.
    - A document's score is the sum of its points over all lists it appears in.
    - Return all document ids sorted by score, highest first. Break ties by id (alphabetically).
  starter: |
    def rrf(*rankings, k=60):
        return list(rankings[0]) if rankings else []
  hints:
    - "Use a dict and `enumerate(ranking, start=1)`."
    - "`sorted(scores, key=lambda d: (-scores[d], d))`"
  tests:
    - name: documents found by several lists rise to the top
      code: |
        assert rrf(["a", "b"], ["b", "c"], ["b", "a"]) == ["b", "a", "c"], rrf(["a", "b"], ["b", "c"], ["b", "a"])
    - name: ties are alphabetical
      code: |
        assert rrf(["a", "b"], ["b", "a"]) == ["a", "b"]
    - name: single list and no lists
      code: |
        assert rrf(["x", "y", "z"]) == ["x", "y", "z"]
        assert rrf() == []
  solution: |
    def rrf(*rankings, k=60):
        scores = {}
        for ranking in rankings:
            for rank, doc in enumerate(ranking, start=1):
                scores[doc] = scores.get(doc, 0) + 1 / (k + rank)
        return sorted(scores, key=lambda d: (-scores[d], d))
- id: retrieval-metrics
  title: Measure retrieval quality
  difficulty: medium
  prompt: |
    Write three retrieval metrics. `retrieved` is a ranked list of ids (best first) and `relevant` is a collection of ids that **should** be found.

    - `recall_at_k(retrieved, relevant, k)`: the fraction of `relevant` ids that appear in `retrieved[:k]`. `0.0` if `relevant` is empty.
    - `precision_at_k(retrieved, relevant, k)`: the fraction of the top `k` retrieved ids that are relevant. Divide by `k` even if fewer than `k` were retrieved. `0.0` if `k <= 0`.
    - `mrr(results)`: **mean reciprocal rank** over a list of `(retrieved, relevant)` pairs. Each query scores `1 / rank` of the first relevant result (rank starts at 1), or `0` if none is found. Return the average (`0.0` for an empty list).
  starter: |
    def recall_at_k(retrieved, relevant, k):
        return 0.0

    def precision_at_k(retrieved, relevant, k):
        return 0.0

    def mrr(results):
        return 0.0
  hints:
    - "Turn `relevant` into a `set` first."
    - "For MRR, `next((i for i, d in enumerate(retrieved, 1) if d in relevant), None)`."
  tests:
    - name: recall
      code: |
        assert abs(recall_at_k(["a", "b", "c"], {"a", "c", "z"}, 2) - 1 / 3) < 1e-9
        assert recall_at_k(["a"], [], 5) == 0.0
    - name: precision
      code: |
        assert precision_at_k(["a", "b", "c", "d"], {"a", "d"}, 2) == 0.5
        assert precision_at_k(["a"], {"a"}, 4) == 0.25
        assert precision_at_k(["a"], {"a"}, 0) == 0.0
    - name: mean reciprocal rank
      code: |
        results = [(["x", "a"], {"a"}), (["a", "b"], {"a"}), (["q"], {"z"})]
        assert abs(mrr(results) - (0.5 + 1 + 0) / 3) < 1e-9
        assert mrr([]) == 0.0
  solution: |
    def recall_at_k(retrieved, relevant, k):
        relevant = set(relevant)
        if not relevant:
            return 0.0
        return len(set(retrieved[:k]) & relevant) / len(relevant)

    def precision_at_k(retrieved, relevant, k):
        if k <= 0:
            return 0.0
        relevant = set(relevant)
        return len([d for d in retrieved[:k] if d in relevant]) / k

    def mrr(results):
        if not results:
            return 0.0
        total = 0.0
        for retrieved, relevant in results:
            relevant = set(relevant)
            rank = next((i for i, d in enumerate(retrieved, 1) if d in relevant), None)
            total += 1 / rank if rank else 0
        return total / len(results)
