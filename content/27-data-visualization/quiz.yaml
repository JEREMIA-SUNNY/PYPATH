- q: Which chart best shows how revenue changed month by month?
  options: ["Pie chart", "Line chart", "Scatter plot", "Histogram"]
  answer: 1
  explain: Line charts show change over an ordered dimension like time.
- q: What's the recommended way to create a matplotlib chart?
  options: ["`plt.plot` calls only", "`fig, ax = plt.subplots()` then call methods on `ax`", "pandas only", "seaborn only"]
  answer: 1
  explain: The object-oriented API is explicit and scales to multiple subplots.
- q: What should a chart's title usually say?
  options: ["The names of the axes", "The key finding", "The file name", "Nothing; titles are clutter"]
  answer: 1
  explain: State the takeaway, e.g. "Kochi drove 60% of growth", so the reader gets the point immediately.
- q: Why call `matplotlib.use("Agg")` in a script that runs on a server?
  options: ["It makes charts prettier", "It selects a non-interactive backend that doesn't need a display", "It enables PNG export", "It's required for bar charts"]
  answer: 1
  explain: The Agg backend renders to files without a GUI, which avoids errors on headless machines.
- q: Why should bar charts start at zero?
  options: ["matplotlib requires it", "Bar length encodes value, so a truncated axis exaggerates differences", "It saves space", "It's only a style preference"]
  answer: 1
  explain: Readers compare bar lengths; cutting off the base distorts the comparison.
