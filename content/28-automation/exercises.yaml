- id: build-cli-parser
  title: Design a CLI
  difficulty: easy
  prompt: |
    Write `build_parser()` returning an `argparse.ArgumentParser` for a tool called `backup`:

    - positional `source` (folder to back up)
    - `--dest` (default `"backups"`)
    - `--keep` an int, default `7` (how many old backups to keep)
    - `-n` / `--dry-run` flag
    - `--format` with choices `zip` or `tar`, default `zip`
  starter: |
    import argparse

    def build_parser():
        return argparse.ArgumentParser(prog="backup")
  hints:
    - "`p.add_argument(\"--keep\", type=int, default=7)`"
    - "`p.add_argument(\"-n\", \"--dry-run\", action=\"store_true\")`"
  tests:
    - name: defaults
      code: |
        a = build_parser().parse_args(["photos"])
        assert (a.source, a.dest, a.keep, a.dry_run, a.format) == ("photos", "backups", 7, False, "zip"), vars(a)
    - name: all options
      code: |
        a = build_parser().parse_args(["docs", "--dest", "D:/bk", "--keep", "3", "-n", "--format", "tar"])
        assert (a.source, a.dest, a.keep, a.dry_run, a.format) == ("docs", "D:/bk", 3, True, "tar"), vars(a)
    - name: rejects a bad format
      code: |
        import contextlib, io
        try:
            with contextlib.redirect_stderr(io.StringIO()):
                build_parser().parse_args(["x", "--format", "rar"])
            raise AssertionError("expected an error for --format rar")
        except SystemExit as e:
            assert e.code == 2
  solution: |
    import argparse

    def build_parser():
        p = argparse.ArgumentParser(prog="backup", description="Back up a folder.")
        p.add_argument("source")
        p.add_argument("--dest", default="backups")
        p.add_argument("--keep", type=int, default=7)
        p.add_argument("-n", "--dry-run", action="store_true")
        p.add_argument("--format", choices=["zip", "tar"], default="zip")
        return p
- id: organize-files
  title: Organise a folder (with dry run)
  difficulty: medium
  prompt: |
    Write `organize(folder, dry_run=False)` that sorts the **files directly inside** `folder` into subfolders by extension (case-insensitive) using `CATEGORIES`; unknown extensions go to `"other"`.

    - Return a sorted list of `(file_name, subfolder)` tuples describing the moves.
    - If `dry_run` is True, **don't move anything**.
    - Never overwrite: if `subfolder/name` already exists, skip that file (leave it in place and leave it out of the result).
    - Ignore subdirectories.
  starter: |
    import shutil
    from pathlib import Path

    CATEGORIES = {".jpg": "images", ".png": "images", ".pdf": "documents", ".csv": "data"}

    def organize(folder, dry_run=False):
        return []
  hints:
    - "Loop `for f in Path(folder).iterdir()`, skip `not f.is_file()`."
    - "`CATEGORIES.get(f.suffix.lower(), \"other\")`"
    - "Create the subfolder with `mkdir(exist_ok=True)` only when actually moving."
  tests:
    - name: dry run moves nothing
      code: |
        from pathlib import Path
        d = Path("dl1"); d.mkdir()
        for n in ["a.JPG", "b.pdf", "c.txt"]:
            (d / n).write_text("x")
        (d / "sub").mkdir()
        assert organize(d, dry_run=True) == [("a.JPG", "images"), ("b.pdf", "documents"), ("c.txt", "other")]
        assert sorted(p.name for p in d.iterdir()) == ["a.JPG", "b.pdf", "c.txt", "sub"]
    - name: real run moves files
      code: |
        from pathlib import Path
        d = Path("dl2"); d.mkdir()
        for n in ["a.png", "b.csv"]:
            (d / n).write_text("x")
        organize(d)
        assert (d / "images" / "a.png").exists() and (d / "data" / "b.csv").exists() and not (d / "a.png").exists()
    - name: never overwrites
      code: |
        from pathlib import Path
        d = Path("dl3"); (d / "images").mkdir(parents=True)
        (d / "images" / "x.jpg").write_text("old")
        (d / "x.jpg").write_text("new")
        assert organize(d) == []
        assert (d / "images" / "x.jpg").read_text() == "old" and (d / "x.jpg").exists()
  solution: |
    import shutil
    from pathlib import Path

    CATEGORIES = {".jpg": "images", ".png": "images", ".pdf": "documents", ".csv": "data"}

    def organize(folder, dry_run=False):
        folder = Path(folder)
        moves = []
        for f in sorted(folder.iterdir()):
            if not f.is_file():
                continue
            sub = CATEGORIES.get(f.suffix.lower(), "other")
            target = folder / sub / f.name
            if target.exists():
                continue
            moves.append((f.name, sub))
            if not dry_run:
                target.parent.mkdir(exist_ok=True)
                shutil.move(str(f), str(target))
        return sorted(moves)
- id: excel-report
  title: Write an Excel report
  difficulty: medium
  prompt: |
    Write `write_report(rows, path)` using **openpyxl**:

    - Sheet title `"Report"`.
    - Header row `["Name", "Amount"]` in **bold**.
    - One row per `(name, amount)` tuple.
    - After the data, a final row with `"Total"` in column A and an Excel **formula** summing column B (e.g. `=SUM(B2:B4)` for three rows).
    - Save to `path`.

    Requires `pip install openpyxl`.
  starter: |
    from openpyxl import Workbook
    from openpyxl.styles import Font

    def write_report(rows, path):
        wb = Workbook()
        wb.save(path)
  hints:
    - "`ws = wb.active; ws.title = \"Report\"; ws.append([...])`"
    - "The last data row is `len(rows) + 1`; the formula is `f\"=SUM(B2:B{len(rows) + 1})\"`."
  tests:
    - name: writes data, header and total formula
      code: |
        from openpyxl import load_workbook
        write_report([("Ana", 100), ("Bo", 250.5), ("Cy", 50)], "r.xlsx")
        ws = load_workbook("r.xlsx")["Report"]
        rows = list(ws.iter_rows(values_only=True))
        assert rows[0] == ("Name", "Amount") and ws["A1"].font.bold and ws["B1"].font.bold
        assert rows[1:4] == [("Ana", 100), ("Bo", 250.5), ("Cy", 50)], rows
        assert rows[4] == ("Total", "=SUM(B2:B4)"), rows[4]
  solution: |
    from openpyxl import Workbook
    from openpyxl.styles import Font

    def write_report(rows, path):
        wb = Workbook()
        ws = wb.active
        ws.title = "Report"
        ws.append(["Name", "Amount"])
        for cell in ws[1]:
            cell.font = Font(bold=True)
        for name, amount in rows:
            ws.append([name, amount])
        ws.append(["Total", f"=SUM(B2:B{len(rows) + 1})"])
        wb.save(path)
