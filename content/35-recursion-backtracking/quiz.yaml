- q: What happens if a recursive function has no base case?
  options: ["It returns None", "It recurses until Python raises RecursionError", "It runs once", "Python adds one automatically"]
  answer: 1
  explain: Without a stopping condition the call stack grows until it hits the recursion limit.
- q: In backtracking, why do we `path.pop()` after the recursive call?
  options: ["To free memory", "To undo the choice so the next option can be tried", "To return the result", "It's optional"]
  answer: 1
  explain: Choose, explore, un-choose. The pop restores the state for the next iteration of the loop.
- q: How many subsets does a set of n elements have?
  options: ["n", "n²", "2ⁿ", "n!"]
  answer: 2
  explain: Each element is either in or out, giving 2 choices n times.
- q: Why append `path[:]` instead of `path` to the results?
  options: ["It's faster", "`path` keeps changing, so you must store a snapshot copy", "Lists can't be appended", "It sorts the path"]
  answer: 1
  explain: Appending `path` stores a reference to the same list, which is mutated (and finally emptied) during backtracking.
- q: What does `@functools.cache` add to a recursive function?
  options: ["Parallelism", "Memoisation, so repeated calls with the same arguments return instantly", "Tail-call optimisation", "Type checking"]
  answer: 1
  explain: Caching turns exponential repeated work (like naive Fibonacci) into linear work.
