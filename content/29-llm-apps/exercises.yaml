- id: build-messages
  title: Build a chat request
  difficulty: easy
  prompt: |
    Write `build_messages(history, user_text, max_turns=3)`:

    - `history` is a list of `(user, assistant)` text pairs, oldest first.
    - Keep only the **last `max_turns` pairs**.
    - Return a list of message dicts alternating `{"role": "user", "content": ...}` and `{"role": "assistant", "content": ...}`, ending with the new user message.
    - Strip surrounding whitespace from `user_text`; if it's empty after stripping, raise `ValueError`.
  starter: |
    def build_messages(history, user_text, max_turns=3):
        return [{"role": "user", "content": user_text}]
  hints:
    - "`history[-max_turns:]` keeps the most recent pairs (works when history is shorter too)."
    - Watch out for `max_turns=0`, where `history[-0:]` is the whole list.
  tests:
    - name: trims history and appends the new message
      code: |
        h = [("hi", "hello!"), ("order 4417?", "email please"), ("a@b.c", "found it"), ("eta?", "tomorrow")]
        msgs = build_messages(h, "  thanks  ", max_turns=2)
        assert msgs == [
            {"role": "user", "content": "a@b.c"}, {"role": "assistant", "content": "found it"},
            {"role": "user", "content": "eta?"}, {"role": "assistant", "content": "tomorrow"},
            {"role": "user", "content": "thanks"},
        ], msgs
    - name: zero turns keeps only the new message
      code: |
        assert build_messages([("a", "b")], "q", max_turns=0) == [{"role": "user", "content": "q"}]
    - name: rejects empty input
      code: |
        try:
            build_messages([], "   ")
            raise AssertionError("expected ValueError")
        except ValueError:
            pass
  solution: |
    def build_messages(history, user_text, max_turns=3):
        text = user_text.strip()
        if not text:
            raise ValueError("empty message")
        recent = history[-max_turns:] if max_turns > 0 else []
        messages = []
        for user, assistant in recent:
            messages.append({"role": "user", "content": user})
            messages.append({"role": "assistant", "content": assistant})
        messages.append({"role": "user", "content": text})
        return messages
- id: parse-model-json
  title: Parse and validate model output
  difficulty: medium
  prompt: |
    A model was asked to reply with JSON like `{"category": "...", "urgent": true, "summary": "..."}`. Write `parse_triage(reply)` that:

    1. Extracts the JSON object, whether the reply is bare JSON, wrapped in a code fence ```` ```json ... ``` ````, or surrounded by extra prose.
    2. Validates it: `category` must be one of `ALLOWED`, `urgent` must be a bool, `summary` a non-empty string.
    3. Returns the dict, or raises `ValueError` if the JSON is missing, invalid, or fails validation.
  starter: |
    import json
    import re

    ALLOWED = {"refund", "delivery", "product_question", "other"}

    def parse_triage(reply):
        return json.loads(reply)
  hints:
    - "Find the first `{` and the last `}` and parse what's between them; that handles fences and prose."
    - "`json.JSONDecodeError` is a subclass of `ValueError`, so it already counts."
    - "Use `isinstance(data.get(\"urgent\"), bool)`."
  tests:
    - name: bare JSON
      code: |
        assert parse_triage('{"category": "refund", "urgent": false, "summary": "Wants money back"}')["category"] == "refund"
    - name: fenced with prose
      code: |
        r = 'Here you go!\n```json\n{"category": "delivery", "urgent": true, "summary": "Late parcel"}\n```\nAnything else?'
        assert parse_triage(r) == {"category": "delivery", "urgent": True, "summary": "Late parcel"}
    - name: rejects bad output
      code: |
        bad = [
            "no json here",
            '{"category": "shipping", "urgent": true, "summary": "x"}',
            '{"category": "refund", "urgent": "yes", "summary": "x"}',
            '{"category": "refund", "urgent": true, "summary": ""}',
            '{"category": "refund", "urgent": true',
        ]
        for b in bad:
            try:
                parse_triage(b)
                raise AssertionError("should reject: " + b)
            except ValueError:
                pass
  solution: |
    import json
    import re

    ALLOWED = {"refund", "delivery", "product_question", "other"}

    def parse_triage(reply):
        start, end = reply.find("{"), reply.rfind("}")
        if start == -1 or end <= start:
            raise ValueError("no JSON object found")
        data = json.loads(reply[start : end + 1])
        if not isinstance(data, dict):
            raise ValueError("expected an object")
        if data.get("category") not in ALLOWED:
            raise ValueError("bad category")
        if not isinstance(data.get("urgent"), bool):
            raise ValueError("urgent must be a bool")
        if not isinstance(data.get("summary"), str) or not data["summary"].strip():
            raise ValueError("summary required")
        return data
- id: token-budget
  title: Fit a prompt into a budget
  difficulty: medium
  prompt: |
    You must keep prompts under a token budget. Using the rough estimate `tokens = ceil(len(text) / 4)`:

    - `estimate_tokens(text)` returns that estimate (an int; empty text is 0).
    - `fit_documents(docs, budget)` takes a list of document strings in **priority order** and returns the longest prefix of them whose **total** estimated tokens is `<= budget`. Stop at the first document that doesn't fit; don't skip ahead.
  starter: |
    import math

    def estimate_tokens(text):
        return len(text)

    def fit_documents(docs, budget):
        return docs
  hints:
    - "`math.ceil(len(text) / 4)`"
    - Keep a running total and `break` when the next doc would exceed the budget.
  tests:
    - name: estimates
      code: |
        assert estimate_tokens("") == 0 and estimate_tokens("abcd") == 1 and estimate_tokens("abcde") == 2
    - name: fits a prefix
      code: |
        docs = ["a" * 40, "b" * 40, "c" * 4, "d" * 400]
        assert fit_documents(docs, 20) == ["a" * 40, "b" * 40], [len(d) for d in fit_documents(docs, 20)]
        assert fit_documents(docs, 25) == docs[:3]
    - name: stops at the first doc that doesn't fit
      code: |
        assert fit_documents(["x" * 100, "y"], 10) == []
  solution: |
    import math

    def estimate_tokens(text):
        return math.ceil(len(text) / 4)

    def fit_documents(docs, budget):
        chosen, total = [], 0
        for d in docs:
            t = estimate_tokens(d)
            if total + t > budget:
                break
            chosen.append(d)
            total += t
        return chosen
- id: dispatch-tool-calls
  title: Run the model's tool calls
  difficulty: medium
  prompt: |
    The model returned a list of tool calls. Write `run_tool_calls(tool_calls, tools)`.

    - Each call is `{"id": "call_1", "name": "add", "arguments": "{\"a\": 1, \"b\": 2}"}`. `arguments` is a **JSON string**.
    - `tools` maps names to Python functions. Call `tools[name](**arguments)`.
    - For every call return a message dict `{"role": "tool", "tool_call_id": <id>, "content": <json string>}` in the same order.
    - On success `content` is `json.dumps({"result": value})`.
    - On **any** failure (unknown tool, invalid JSON, the function raised) `content` is `json.dumps({"error": "<message>"})`. One failing call must not stop the others.
  starter: |
    import json

    def run_tool_calls(tool_calls, tools):
        return []
  hints:
    - "Wrap the body for each call in `try/except Exception`."
    - "An unknown tool raises `KeyError` on `tools[name]`; `json.loads` raises `ValueError`."
  tests:
    - name: runs calls in order and returns tool messages
      code: |
        tools = {"add": lambda a, b: a + b, "upper": lambda s: s.upper()}
        calls = [
            {"id": "c1", "name": "add", "arguments": '{"a": 1, "b": 2}'},
            {"id": "c2", "name": "upper", "arguments": '{"s": "hi"}'},
        ]
        out = run_tool_calls(calls, tools)
        assert out == [
            {"role": "tool", "tool_call_id": "c1", "content": json.dumps({"result": 3})},
            {"role": "tool", "tool_call_id": "c2", "content": json.dumps({"result": "HI"})},
        ], out
    - name: failures become error results and do not stop later calls
      code: |
        tools = {"boom": lambda: 1 / 0, "ok": lambda: "fine"}
        calls = [
            {"id": "a", "name": "nope", "arguments": "{}"},
            {"id": "b", "name": "ok", "arguments": "not json"},
            {"id": "c", "name": "boom", "arguments": "{}"},
            {"id": "d", "name": "ok", "arguments": "{}"},
        ]
        out = run_tool_calls(calls, tools)
        assert [m["tool_call_id"] for m in out] == ["a", "b", "c", "d"]
        assert all("error" in json.loads(m["content"]) for m in out[:3])
        assert json.loads(out[3]["content"]) == {"result": "fine"}
  solution: |
    import json

    def run_tool_calls(tool_calls, tools):
        messages = []
        for call in tool_calls:
            try:
                args = json.loads(call["arguments"])
                content = json.dumps({"result": tools[call["name"]](**args)})
            except Exception as e:
                content = json.dumps({"error": f"{type(e).__name__}: {e}"})
            messages.append({"role": "tool", "tool_call_id": call["id"], "content": content})
        return messages
- id: collect-stream
  title: Assemble a streamed reply
  difficulty: easy
  prompt: |
    A streaming API yields chunk dicts like `{"delta": "Hel", "finish_reason": None}`. `delta` can be `None` (for example on the last chunk).

    Write `collect_stream(chunks)` that returns `(text, finish_reason)`:

    - `text` is every non-`None` delta joined together, in order.
    - `finish_reason` is the last non-`None` finish reason, or `None` if there was none.
    - If the finish reason is `"length"`, raise `RuntimeError("truncated")` instead: a cut-off answer must not be treated as complete.
  starter: |
    def collect_stream(chunks):
        return "", None
  hints:
    - "Loop once: append deltas, remember any non-None finish reason."
  tests:
    - name: joins deltas and reports the finish reason
      code: |
        chunks = [{"delta": "Hel", "finish_reason": None}, {"delta": "lo", "finish_reason": None}, {"delta": None, "finish_reason": "stop"}]
        assert collect_stream(chunks) == ("Hello", "stop")
    - name: no finish reason
      code: |
        assert collect_stream([{"delta": "a", "finish_reason": None}]) == ("a", None)
        assert collect_stream([]) == ("", None)
    - name: truncated replies are an error
      code: |
        try:
            collect_stream([{"delta": "partial", "finish_reason": "length"}])
            raise AssertionError("expected RuntimeError")
        except RuntimeError as e:
            assert "truncated" in str(e)
  solution: |
    def collect_stream(chunks):
        parts, reason = [], None
        for c in chunks:
            if c.get("delta") is not None:
                parts.append(c["delta"])
            if c.get("finish_reason") is not None:
                reason = c["finish_reason"]
        if reason == "length":
            raise RuntimeError("truncated")
        return "".join(parts), reason
- id: retry-with-backoff
  title: Retry with exponential backoff
  difficulty: medium
  prompt: |
    Write `call_with_retry(fn, retries=3, base_delay=1.0, sleep=time.sleep)`.

    - Call `fn()`. If it returns, return the value.
    - If it raises `TransientError` (defined for you), wait and try again. Before retry number `n` (counting from 0) sleep `base_delay * 2**n` seconds by calling the `sleep` argument.
    - Allow **`retries` retries**, so up to `retries + 1` calls in total. If it still fails, re-raise the last `TransientError`.
    - Any **other** exception is raised immediately, with no retry and no sleep.
  starter: |
    import time

    class TransientError(Exception):
        pass

    def call_with_retry(fn, retries=3, base_delay=1.0, sleep=time.sleep):
        return fn()
  hints:
    - "A `for attempt in range(retries + 1)` loop with `try/except TransientError`."
    - "Only sleep when another attempt will follow."
  tests:
    - name: succeeds after transient failures with growing delays
      code: |
        calls, delays = [], []
        def flaky():
            calls.append(1)
            if len(calls) < 3:
                raise TransientError("429")
            return "ok"
        assert call_with_retry(flaky, retries=3, base_delay=0.5, sleep=delays.append) == "ok"
        assert delays == [0.5, 1.0], delays
    - name: gives up after the allowed retries
      code: |
        delays = []
        def always():
            raise TransientError("down")
        try:
            call_with_retry(always, retries=2, base_delay=1, sleep=delays.append)
            raise AssertionError("expected TransientError")
        except TransientError:
            pass
        assert delays == [1, 2], delays
    - name: other errors are not retried
      code: |
        delays = []
        def bad():
            raise ValueError("bad request")
        try:
            call_with_retry(bad, sleep=delays.append)
            raise AssertionError("expected ValueError")
        except ValueError:
            pass
        assert delays == []
  solution: |
    import time

    class TransientError(Exception):
        pass

    def call_with_retry(fn, retries=3, base_delay=1.0, sleep=time.sleep):
        for attempt in range(retries + 1):
            try:
                return fn()
            except TransientError:
                if attempt == retries:
                    raise
                sleep(base_delay * 2**attempt)
