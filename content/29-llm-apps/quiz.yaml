- q: Why do chat applications resend previous messages on every API call?
  options: ["To prevent caching", "The model is stateless and only sees what you send in the request", "It's required for streaming", "To increase the token count"]
  answer: 1
  explain: The API has no memory between calls; conversation history must be included in each request (within the context window).
- q: Which temperature setting suits extracting fields from invoices?
  options: ["High (around 1.0)", "Low (around 0 to 0.2)", "It doesn't matter", "Negative"]
  answer: 1
  explain: Low temperature makes output more deterministic, which is what you want for extraction and classification.
- q: A model returns JSON wrapped in a markdown code fence. What should your code do?
  options: ["Show it to the user as is", "Extract the JSON, parse it and validate the fields", "Raise an error and give up", "Increase max_tokens"]
  answer: 1
  explain: Parse defensively and validate against a schema (e.g. Pydantic); retry or fall back if it doesn't validate.
- q: What is prompt injection?
  options: ["Inserting variables into a template", "Untrusted input containing instructions that try to override your prompt", "Sending too many tokens", "A way to speed up responses"]
  answer: 1
  explain: Treat external text as data, isolate it with delimiters, and don't let model output trigger sensitive actions unchecked.
- q: What's the purpose of an eval set?
  options: ["Training the model", "Measuring output quality consistently whenever prompts or models change", "Reducing cost", "Encrypting prompts"]
  answer: 1
  explain: Evals are your regression tests for AI behaviour.
- q: In tool calling, who actually runs the function?
  options: ["The model, inside the API", "Your code, using the name and arguments the model returned", "The model provider's servers", "The browser"]
  answer: 1
  explain: The model only asks for a call. Your application validates the arguments, runs the function and sends the result back.
- q: A tool call fails (bad arguments). What is a good way to handle it?
  options: ["Crash the request", "Return the error as the tool result so the model can adjust", "Ignore the call", "Retry forever"]
  answer: 1
  explain: Feeding the error back lets the model correct its arguments or explain the problem to the user.
- q: A streamed response ends with finish_reason "length". What does that mean?
  options: ["It completed normally", "The answer was cut off by the token limit", "The model refused", "The network dropped"]
  answer: 1
  explain: "\"length\" means max tokens was hit mid-answer. Increase the limit or shorten the request instead of showing a half answer as complete."
- q: Which errors should be retried with backoff?
  options: ["Every error", "Transient ones such as rate limits and timeouts", "Invalid request errors", "Authentication errors"]
  answer: 1
  explain: Retrying a request that is wrong will fail again and cost money. Retry rate limits, timeouts and overloaded servers.
