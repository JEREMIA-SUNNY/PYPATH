- id: two-sum
  title: Two sum
  difficulty: easy
  prompt: |
    Given a list `nums` and an integer `target`, return the **indices** `[i, j]` (with `i < j`) of the two numbers that add up to `target`. Exactly one answer exists, and you may not use the same element twice.

    Aim for O(n). The tests include 100,000 numbers.

    ```py
    two_sum([2, 7, 11, 15], 9)   # -> [0, 1]
    ```
  starter: |
    def two_sum(nums, target):
        for i in range(len(nums)):
            for j in range(i + 1, len(nums)):
                if nums[i] + nums[j] == target:
                    return [i, j]
  hints:
    - Store each value's index in a dict as you go.
    - "Before storing `x`, check whether `target - x` is already in the dict."
  tests:
    - name: examples
      code: |
        assert two_sum([2, 7, 11, 15], 9) == [0, 1] and two_sum([3, 2, 4], 6) == [1, 2] and two_sum([3, 3], 6) == [0, 1]
    - name: large input quickly
      code: |
        import time
        nums = list(range(100_000))
        t = time.perf_counter()
        assert two_sum(nums, 199_997) == [99_998, 99_999]
        assert time.perf_counter() - t < 1.0, "too slow, aim for O(n)"
  solution: |
    def two_sum(nums, target):
        seen = {}
        for i, x in enumerate(nums):
            if target - x in seen:
                return [seen[target - x], i]
            seen[x] = i
        return []
- id: group-anagrams
  title: Group anagrams
  difficulty: medium
  prompt: |
    Write `group_anagrams(words)` that groups words that are anagrams of each other. Return a list of groups where **each group is sorted** and the **groups are sorted** (by their first word), so the output is deterministic.

    ```py
    group_anagrams(["eat", "tea", "tan", "ate", "nat", "bat"])
    # -> [["ate", "eat", "tea"], ["bat"], ["nat", "tan"]]
    ```
  starter: |
    def group_anagrams(words):
        return [words]
  hints:
    - "Key: `\"\".join(sorted(word))`."
    - Collect into a `defaultdict(list)`, then sort each group and the list of groups.
  tests:
    - name: example
      code: |
        assert group_anagrams(["eat", "tea", "tan", "ate", "nat", "bat"]) == [["ate", "eat", "tea"], ["bat"], ["nat", "tan"]]
    - name: empty strings and singles
      code: |
        assert group_anagrams(["", "a", ""]) == [["", ""], ["a"]]
  solution: |
    from collections import defaultdict

    def group_anagrams(words):
        groups = defaultdict(list)
        for w in words:
            groups["".join(sorted(w))].append(w)
        return sorted(sorted(g) for g in groups.values())
- id: top-k-frequent
  title: Top k frequent elements
  difficulty: medium
  prompt: |
    Return the `k` most frequent elements of `nums`, most frequent first. If two elements are equally frequent, the **smaller** value comes first.

    ```py
    top_k_frequent([1, 1, 1, 2, 2, 3], 2)   # -> [1, 2]
    ```
  starter: |
    def top_k_frequent(nums, k):
        return nums[:k]
  hints:
    - "`Counter(nums)` gives the frequencies."
    - "Sort the items by `(-count, value)` and take the first k."
  tests:
    - name: example
      code: |
        assert top_k_frequent([1, 1, 1, 2, 2, 3], 2) == [1, 2]
    - name: ties broken by value
      code: |
        assert top_k_frequent([5, 3, 5, 3, 9], 2) == [3, 5]
    - name: k equals distinct count
      code: |
        assert top_k_frequent([4, 4, -1], 2) == [4, -1]
  solution: |
    from collections import Counter

    def top_k_frequent(nums, k):
        counts = Counter(nums)
        return [v for v, _ in sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[:k]]
- id: longest-consecutive
  title: Longest consecutive sequence
  difficulty: hard
  prompt: |
    Given an unsorted list of integers, return the length of the longest run of **consecutive** values (in any order in the list). It must run in **O(n)**: no sorting. The tests include 200,000 numbers.

    ```py
    longest_consecutive([100, 4, 200, 1, 3, 2])   # -> 4  (1, 2, 3, 4)
    ```
  starter: |
    def longest_consecutive(nums):
        return 0
  hints:
    - Put everything in a set.
    - "Only start counting at numbers that begin a run: `x - 1 not in s`."
  tests:
    - name: examples
      code: |
        assert longest_consecutive([100, 4, 200, 1, 3, 2]) == 4
        assert longest_consecutive([0, 3, 7, 2, 5, 8, 4, 6, 0, 1]) == 9
        assert longest_consecutive([]) == 0
    - name: large input quickly
      code: |
        import random, time
        nums = list(range(200_000))
        random.Random(1).shuffle(nums)
        t = time.perf_counter()
        assert longest_consecutive(nums) == 200_000
        assert time.perf_counter() - t < 1.5, "too slow, make it O(n)"
  solution: |
    def longest_consecutive(nums):
        s = set(nums)
        best = 0
        for x in s:
            if x - 1 not in s:
                length = 1
                while x + length in s:
                    length += 1
                best = max(best, length)
        return best
