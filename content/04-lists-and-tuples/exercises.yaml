- id: second-largest
  title: Second largest
  difficulty: easy
  prompt: |
    Complete `second_largest(nums)` so it returns the second largest **distinct** value in the list. You can assume there are at least two distinct values.

    ```py
    second_largest([4, 9, 2, 9, 7])  # -> 7
    ```
  starter: |
    def second_largest(nums):
        return max(nums)
  hints:
    - "`set(nums)` removes duplicates."
    - "`sorted(...)` then index `[-2]`."
  tests:
    - name: ignores duplicates of the max
      code: assert second_largest([4, 9, 2, 9, 7]) == 7, second_largest([4, 9, 2, 9, 7])
    - name: negatives
      code: assert second_largest([-5, -1, -3]) == -3
    - name: two values
      code: assert second_largest([1, 2]) == 1
  solution: |
    def second_largest(nums):
        return sorted(set(nums))[-2]
- id: rotate
  title: Rotate a list
  difficulty: medium
  prompt: |
    Complete `rotate(items, k)` so it returns a **new** list rotated `k` steps to the right. `k` may be larger than the list, and the list may be empty.

    ```py
    rotate([1, 2, 3, 4, 5], 2)   # -> [4, 5, 1, 2, 3]
    rotate([1, 2, 3], 4)         # -> [3, 1, 2]
    ```
  starter: |
    def rotate(items, k):
        return items
  hints:
    - "Rotating by `len(items)` changes nothing, so use `k % len(items)`."
    - "Slices: `items[-k:] + items[:-k]`. Watch out for `k == 0`."
  tests:
    - name: rotate by 2
      code: assert rotate([1, 2, 3, 4, 5], 2) == [4, 5, 1, 2, 3], rotate([1, 2, 3, 4, 5], 2)
    - name: k larger than length
      code: assert rotate([1, 2, 3], 4) == [3, 1, 2]
    - name: k is zero
      code: assert rotate([1, 2, 3], 0) == [1, 2, 3]
    - name: empty list
      code: assert rotate([], 3) == []
    - name: original is not modified
      code: |
        data = [1, 2, 3]
        rotate(data, 1)
        assert data == [1, 2, 3]
  solution: |
    def rotate(items, k):
        if not items:
            return []
        k = k % len(items)
        return items[-k:] + items[:-k] if k else items[:]
- id: summary-stats
  title: Min, max and mean
  difficulty: easy
  prompt: |
    Complete `stats(nums)` so it returns a tuple `(smallest, largest, mean)`, with the mean rounded to 1 decimal place.

    ```py
    stats([3, 7, 8])   # -> (3, 8, 6.0)
    ```
  starter: |
    def stats(nums):
        return (0, 0, 0)
  hints:
    - "`min`, `max` and `sum` all accept a list."
    - "Mean is `sum(nums) / len(nums)`; wrap it in `round(..., 1)`."
  tests:
    - name: basic
      code: assert stats([3, 7, 8]) == (3, 8, 6.0), stats([3, 7, 8])
    - name: rounding
      code: assert stats([1, 2, 2]) == (1, 2, 1.7)
    - name: returns a tuple
      code: assert isinstance(stats([1, 2]), tuple)
  solution: |
    def stats(nums):
        return min(nums), max(nums), round(sum(nums) / len(nums), 1)
